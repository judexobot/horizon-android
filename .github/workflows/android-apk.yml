# Build a publicly distributable Android APK; prepared Minecraft inputs stay on the runner.
name: Android APK (arm64-v8a)

on:
  push:
    branches:
      - android
      - codex/android-memory-ci
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build and audit public ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-apk-target
      HORIZON_TELEMETRY_URL: "off"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: ""

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Install native prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          rustup target add aarch64-linux-android

      - name: Cache Rust dependencies and compiled objects
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            .local/ci-apk-target
          key: public-apk-arm64-v1-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            public-apk-arm64-v1-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}-

      - name: Prepare pinned engine tables privately
        run: python3 tools/android_prepare.py
        timeout-minutes: 90

      - name: Compile, package, sign and audit public APK
        run: |
          python3 tools/android_build.py \
            --abi arm64-v8a \
            --public \
            --sdk "$ANDROID_HOME" \
            --java-home "$JAVA_HOME" \
            --gradle "$(command -v gradle)"
        timeout-minutes: 180

      - name: Stage APK and checksum
        run: |
          set -euo pipefail
          mkdir -p .local/android/artifact
          cp .local/android/apk/arm64-v8a/horizon-android-public.apk \
             .local/android/artifact/Horizon-Android-arm64-v8a-public.apk
          cp LICENSE .local/android/artifact/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md .local/android/artifact/THIRD_PARTY_NOTICES.md
          (
            cd .local/android/artifact
            sha256sum Horizon-Android-arm64-v8a-public.apk > SHA256SUMS.txt
          )
          ls -lh .local/android/artifact

      - name: Upload installable public APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Horizon-Android-arm64-v8a-public
          path: .local/android/artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
